name: Update site

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pillow
        run: pip install pillow

      - name: Scrape telegram channels
        run: python3 scrape.py

      - name: Save data files
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/raw.json site/products.json site/config.json
          git add site/first.json site/light.json
          git add site/p/
          git diff --cached --quiet || git commit -m "update products"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
